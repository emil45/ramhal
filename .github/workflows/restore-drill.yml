name: restore-drill

# Proves the second backup mechanism (.github/workflows/backup.yml,
# docs/DECISIONS.md §11) actually restores, instead of leaving that as a
# documented but never-executed hypothesis (docs/RECOVERY.md). It restores into
# a throwaway postgres:18 service container that lives and dies with this job,
# so it touches no real database and spends none of Neon's transfer allowance.
# Run manually, from the Actions tab, whenever someone wants to re-verify the
# procedure still works — not on a schedule.
on:
  workflow_dispatch:
    inputs:
      dump_object_key:
        description: 'Which dump to restore, e.g. ramhal-2026-09-22T15-33-42Z.sql.gz — leave blank for the most recent'
        required: false

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKUP_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_REGION: ${{ secrets.BACKUP_S3_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      # R2 does not implement the newer default upload checksums.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      TARGET_DATABASE_URI: postgresql://postgres:drill@localhost:5432/postgres
    steps:
      - name: Install the matching PostgreSQL client
        run: |
          sudo apt update
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Find the dump to restore
        run: |
          KEY="${{ inputs.dump_object_key }}"
          if [ -z "$KEY" ]; then
            KEY=$(aws s3api list-objects-v2 \
              --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION" \
              --bucket "$BACKUP_BUCKET" \
              --query 'sort_by(Contents,&LastModified)[-1].Key' --output text)
          fi
          echo "Restoring ${KEY}"
          echo "DUMP_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Download it
        run: |
          aws s3 cp "s3://${BACKUP_BUCKET}/${DUMP_KEY}" dump.sql.gz \
            --endpoint-url "$BACKUP_ENDPOINT" --region "$BACKUP_REGION"

      - name: Create the roles the dump names
        # The dump was taken on Neon, where every object is owned by a Neon role
        # that does not exist in a plain Postgres. Creating them, rather than
        # stripping ownership out of the dump, keeps the file untouched.
        run: |
          gunzip -c dump.sql.gz | grep -oE 'OWNER TO [a-z_]+' | awk '{print $3}' | sort -u |
            while read -r role; do
              echo "Creating role ${role}"
              psql "$TARGET_DATABASE_URI" -v ON_ERROR_STOP=1 -c "CREATE ROLE ${role} NOLOGIN"
            done

      - name: Restore into the container
        run: |
          set -o pipefail
          gunzip -c dump.sql.gz | psql "$TARGET_DATABASE_URI" -v ON_ERROR_STOP=1

      - name: Verify the catalogue and users came back
        run: |
          echo "books:" && psql "$TARGET_DATABASE_URI" -t -c "SELECT count(*) FROM books;"
          echo "users:" && psql "$TARGET_DATABASE_URI" -t -c "SELECT count(*) FROM users;"
